name: Build & Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore AcxiomCRM.sln

    - name: Build Solution
      run: dotnet build AcxiomCRM.sln --no-restore -c Release

    - name: Run xUnit Test Suite
      run: dotnet test AcxiomCRM.sln --no-build -c Release --verbosity normal
